name: Scribe CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.12.0

jobs:
  format:
    name: Format
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install clang-format
      run: brew install clang-format

    - name: Check formatting
      run: >
        find . \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.mm" -o -name "*.m" \)
        -not -path "./build/*" -not -path "./.git/*" -print0
        | xargs -0 clang-format -style=file --dry-run -Werror

  build:
    name: Build&Test
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{env.QT_VERSION}}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtmultimedia
        cache: true

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  sanitizers:
    name: AddressSanitizer
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{env.QT_VERSION}}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtmultimedia
        cache: true

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build-asan
        -DCMAKE_BUILD_TYPE=Debug
        -DSCRIBE_ENABLE_ASAN=ON
        -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

    - name: Build
      run: cmake --build ${{github.workspace}}/build-asan

    - name: Test
      working-directory: ${{github.workspace}}/build-asan
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      run: ctest --output-on-failure
